name: Deploy React Portfolio to AWS S3 and CloudFront

on:
  push:
    branches:
      - main  # Set this to your default branch (e.g., main or master)

jobs:
  deploy:
    name: Build & Deploy Portfolio to AWS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # Step 3: Install all packages/dependencies
      - name: Install Dependencies
        run: npm ci

      # New Step 3.5: Force-inject the native Linux binary for Tailwind Oxide
      - name: Force Install Linux Native Bindings
        run: npm install @tailwindcss/oxide-linux-x64-gnu@4.1.14 --no-save

      # Step 4: Compile/Build the React asset bundles via Vite
      - name: Build Application
        run: npm run build

      # Step 5: Configure AWS Credentials with Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Set this to the AWS region hosting your bucket (e.g., us-east-1)

      # Step 6: Sync Vite's compiled 'dist/' output directly to the target S3 Bucket
      - name: Synchronize Static Files to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete

      # Step 7: Invalidate the CloudFront Distribution cache to instantly publish updates live
      - name: Invalidate CloudFront Distribution Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
